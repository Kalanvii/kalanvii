<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KALANVII | Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            burgundy: { DEFAULT: '#430917', light: '#611024' },
            champagne: { DEFAULT: '#eedfc8', silk: '#faf6f0', border: '#decbb4' },
            gold: '#c5a059'
          },
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            sans: ['Montserrat', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-champagne-silk text-gray-800 font-sans min-h-screen">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full border border-champagne-border text-center">
      <h1 class="font-[Cinzel] text-3xl text-burgundy font-bold mb-2">KALANVII</h1>
      <p class="text-xs text-gray-500 uppercase tracking-widest mb-6">Maison Admin Portal</p>
      <input type="password" id="pinInput" placeholder="Enter Secure PIN" class="w-full text-center p-3 border border-champagne-border rounded-lg mb-4 focus:outline-none focus:border-gold">
      <button onclick="checkPin()" class="w-full py-3 bg-burgundy text-champagne-silk uppercase tracking-widest text-xs font-bold rounded-lg hover:bg-burgundy-light transition">Authenticate</button>
      <p id="errorMsg" class="text-red-500 text-xs mt-3 hidden">Incorrect PIN. Access Denied.</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden min-h-screen flex flex-col">
    <!-- TOP NAV -->
    <header class="bg-burgundy text-champagne-silk py-4 px-6 shadow-md flex justify-between items-center">
      <div>
        <h2 class="font-[Cinzel] text-xl font-bold tracking-widest">KALANVII ADMIN</h2>
        <p class="text-[10px] uppercase tracking-widest text-champagne/70">Master Control</p>
      </div>
      <div class="flex gap-4 text-xs font-bold tracking-widest uppercase">
        <button onclick="switchTab('inventory')" id="tabInventory" class="hover:text-gold border-b-2 border-gold transition px-2 py-1">Inventory</button>
        <button onclick="switchTab('leads')" id="tabLeads" class="hover:text-gold border-b-2 border-transparent transition px-2 py-1">Leads & Orders</button>
        <a href="./index.html" class="text-champagne/50 hover:text-white px-2 py-1">Exit →</a>
      </div>
    </header>

    <main class="p-6 max-w-7xl mx-auto w-full flex-grow">
      
      <!-- INVENTORY SECTION -->
      <section id="inventorySection" class="space-y-8">
        <div class="bg-white p-6 rounded-2xl shadow-md border border-champagne-border">
          <h3 class="font-[Cinzel] text-lg text-burgundy font-bold uppercase tracking-widest border-b border-champagne-border pb-2 mb-4">Add New Masterpiece</h3>
          <form id="uploadForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="title" placeholder="Product Title (e.g. GULABÉ)" required class="p-3 border rounded-lg text-sm bg-gray-50 focus:border-gold outline-none">
            <input type="text" id="hindi" placeholder="Hindi Title (e.g. गुलाबी)" class="p-3 border rounded-lg text-sm bg-gray-50 focus:border-gold outline-none">
            <input type="number" id="priceInr" placeholder="Price (INR)" required class="p-3 border rounded-lg text-sm bg-gray-50 focus:border-gold outline-none">
            <input type="number" id="priceUsd" placeholder="Price (USD)" required class="p-3 border rounded-lg text-sm bg-gray-50 focus:border-gold outline-none">
            <select id="category" class="p-3 border rounded-lg text-sm bg-gray-50 focus:border-gold outline-none">
              <option value="Potlis">Potlis & Batua</option>
              <option value="Crescents">Crescent Clutches</option>
              <option value="Minaudieres">Minaudières</option>
              <option value="Cocktail">Cocktail Bags</option>
            </select>
            <input type="url" id="image" placeholder="Main Image URL" required class="p-3 border rounded-lg text-sm bg-gray-50 focus:border-gold outline-none">
            <div class="col-span-full">
              <button type="button" onclick="uploadProduct()" class="w-full py-3 bg-burgundy hover:bg-burgundy-light text-champagne-silk uppercase tracking-widest text-xs font-bold rounded-lg transition shadow-md">Add to Collection</button>
            </div>
          </form>
        </div>

        <div>
          <h3 class="font-[Cinzel] text-lg text-burgundy font-bold uppercase tracking-widest border-b border-champagne-border pb-2 mb-4">Current Inventory</h3>
          <div id="adminProductList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="text-sm text-gray-500 py-4 col-span-full">Loading inventory...</div>
          </div>
        </div>
      </section>

      <!-- LEADS & ORDERS SECTION -->
      <section id="leadsSection" class="hidden space-y-6">
        <h3 class="font-[Cinzel] text-lg text-burgundy font-bold uppercase tracking-widest border-b border-champagne-border pb-2 mb-4">Captured Orders & Leads</h3>
        <div class="bg-white rounded-2xl shadow-md border border-champagne-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-champagne-soft text-burgundy font-[Cinzel] uppercase text-[10px] tracking-widest">
                <tr>
                  <th class="p-4">Date</th>
                  <th class="p-4">Customer Details</th>
                  <th class="p-4">Shipping Address</th>
                  <th class="p-4">Order Value</th>
                  <th class="p-4">Requested Items</th>
                </tr>
              </thead>
              <tbody id="leadsTableBody" class="divide-y divide-champagne-border text-xs">
                <tr><td colspan="5" class="p-8 text-center text-gray-500">Loading leads...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script>
    const SUPABASE_URL = "https://zojkqormcpdnsonzfcbt.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_qkjIGoIVgNW7t7xy0agihg_hWOUYW3b";
    
    let supabaseClient = null;
    function getSupabase() {
      if (!supabaseClient && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      return supabaseClient;
    }

    function checkPin() {
      if (document.getElementById('pinInput').value === '1221') {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        loadAdminCatalog();
        loadOrders();
      } else {
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    }

    function switchTab(tab) {
      if (tab === 'inventory') {
        document.getElementById('inventorySection').classList.remove('hidden');
        document.getElementById('leadsSection').classList.add('hidden');
        document.getElementById('tabInventory').classList.add('border-gold');
        document.getElementById('tabInventory').classList.remove('border-transparent');
        document.getElementById('tabLeads').classList.add('border-transparent');
        document.getElementById('tabLeads').classList.remove('border-gold');
      } else {
        document.getElementById('inventorySection').classList.add('hidden');
        document.getElementById('leadsSection').classList.remove('hidden');
        document.getElementById('tabLeads').classList.add('border-gold');
        document.getElementById('tabLeads').classList.remove('border-transparent');
        document.getElementById('tabInventory').classList.add('border-transparent');
        document.getElementById('tabInventory').classList.remove('border-gold');
        loadOrders();
      }
    }

    async function loadAdminCatalog() {
      const client = getSupabase();
      if (!client) return setTimeout(loadAdminCatalog, 500);
      const { data } = await client.from('products').select('*').order('created_at', { ascending: false });
      
      const container = document.getElementById('adminProductList');
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="col-span-full py-4 text-gray-500 text-sm">No items found.</div>';
        return;
      }

      container.innerHTML = data.map(item => `
        <div class="bg-white border border-champagne-border rounded-xl p-3 flex flex-col justify-between shadow-sm">
          <div>
            <img src="${item.image_url}" class="w-full h-32 object-cover rounded-lg mb-2">
            <h4 class="font-bold text-xs text-burgundy truncate">${item.title}</h4>
            <p class="text-[10px] text-gray-500">₹${item.price_inr} | $${item.price_usd}</p>
            <p class="text-[9px] uppercase font-bold ${item.is_sold_out ? 'text-red-600' : 'text-emerald-600'} mt-1">${item.is_sold_out ? 'SOLD OUT' : 'IN STOCK'}</p>
          </div>
          <div class="mt-3 pt-3 border-t border-champagne-border flex gap-2">
            <button onclick="toggleSoldOut('${item.id}', ${item.is_sold_out})" class="flex-grow py-1.5 bg-gray-100 hover:bg-gray-200 text-[9px] font-bold uppercase rounded">Toggle Stock</button>
            <button onclick="deleteProduct('${item.id}')" class="px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 text-[9px] font-bold uppercase rounded">Drop</button>
          </div>
        </div>
      `).join('');
    }

    async function uploadProduct() {
      const client = getSupabase();
      const product = {
        title: document.getElementById('title').value,
        hindi_title: document.getElementById('hindi').value,
        price_inr: document.getElementById('priceInr').value,
        price_usd: document.getElementById('priceUsd').value,
        category: document.getElementById('category').value,
        image_url: document.getElementById('image').value,
        is_sold_out: false
      };
      
      await client.from('products').insert([product]);
      document.getElementById('uploadForm').reset();
      loadAdminCatalog();
    }

    async function toggleSoldOut(id, currentState) {
      const client = getSupabase();
      await client.from('products').update({ is_sold_out: !currentState }).eq('id', id);
      loadAdminCatalog();
    }

    async function deleteProduct(id) {
      if(confirm("Permanently delete this piece?")) {
        const client = getSupabase();
        await client.from('products').delete().eq('id', id);
        loadAdminCatalog();
      }
    }

    async function loadOrders() {
      const client = getSupabase();
      if (!client) return;
      const { data, error } = await client.from('orders').select('*').order('created_at', { ascending: false });
      
      const tbody = document.getElementById('leadsTableBody');
      if (error || !data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-gray-500">No leads captured yet. Keep promoting!</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(order => {
        const date = new Date(order.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit' });
        
        let itemsHtml = "No items recorded";
        if (order.order_details && Array.isArray(order.order_details)) {
          itemsHtml = order.order_details.map(i => `• ${i.qty}x ${i.title}`).join('<br>');
        }

        return `
          <tr class="hover:bg-champagne-soft/50 transition">
            <td class="p-4 whitespace-nowrap">${date}</td>
            <td class="p-4">
              <div class="font-bold text-burgundy">${order.customer_name}</div>
              <div>${order.customer_phone}</div>
              <div class="text-gray-500 text-[10px]">${order.customer_email}</div>
            </td>
            <td class="p-4 max-w-xs truncate">${order.shipping_address}</td>
            <td class="p-4 font-bold text-burgundy">${order.cart_total}</td>
            <td class="p-4 text-gray-600">${itemsHtml}</td>
          </tr>
        `;
      }).join('');
    }
  </script>
</body>
</html>
